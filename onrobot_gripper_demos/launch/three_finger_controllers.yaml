/**/controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diameter_controller:
      type: forward_command_controller/ForwardCommandController
    gripper_state_broadcaster:
      type: onrobot_gripper_controllers/GripperStateBroadcaster
    three_finger_limit_broadcaster:
      type: state_interfaces_broadcaster/StateInterfacesBroadcaster

/**/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    publish_dynamic_joint_states: true
    joints: [grip_diameter, finger_angle]
    interfaces: [position, velocity]

/**/three_finger_limit_broadcaster:
  ros__parameters:
    interfaces:
      - grip_diameter/minimum_external_diameter
      - grip_diameter/maximum_external_diameter

/**/diameter_controller:
  ros__parameters:
    joints: [grip_diameter]
    interface_name: position

/**/gripper_state_broadcaster:
  ros__parameters:
    # The launch file overrides model with 3fg15 or 3fg25 for the selected
    # device; the remaining contract is common to both models.
    model: 3fg
    task_joint: grip_diameter
    mechanism_joint: finger_angle
    mechanism_dimension: angular
    mapping_source: device_measured
    publish_rate: 50.0
    diagnostic_rate: 1.0
